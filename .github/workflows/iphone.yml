name: iPhone Cloud

on:
  workflow_dispatch:

jobs:

  iphone:

    runs-on: macos-26

    timeout-minutes: 60

    steps:

      # ======================================================
      # INFORMATIONS MAC
      # ======================================================

      - name: Mac information
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "MAC CLOUD"
          echo "================================"

          uname -a
          uname -m

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Xcode path:"
          xcode-select -p

          echo ""
          echo "Available simulators:"
          xcrun simctl list devices available


      # ======================================================
      # INSTALLER BAGUETTE + CLOUDFLARED
      # ======================================================

      - name: Install Baguette and Cloudflare
        shell: bash
        run: |
          set -e

          echo "Installing Baguette..."

          brew install baguette

          echo "Installing Cloudflared..."

          brew install cloudflared

          echo ""
          echo "Baguette:"
          baguette --help | head -30 || true

          echo ""
          echo "Cloudflared:"
          cloudflared --version


      # ======================================================
      # CHOISIR IPHONE 17 PRO
      # ======================================================

      - name: Boot iPhone 17 Pro
        id: simulator
        shell: bash
        run: |
          set -e

          echo "Searching iPhone 17 Pro..."

          UDID="$(
            xcrun simctl list devices available |
            grep "iPhone 17 Pro (" |
            tail -1 |
            sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
          )"

          if [ -z "$UDID" ]; then

            echo "iPhone 17 Pro not found."

            echo "Trying iPhone 17..."

            UDID="$(
              xcrun simctl list devices available |
              grep "iPhone 17 (" |
              tail -1 |
              sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
            )"

          fi

          if [ -z "$UDID" ]; then

            echo "ERROR: no iPhone simulator found."

            xcrun simctl list devices available

            exit 1

          fi

          echo "UDID=$UDID"

          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$UDID" || true

          echo "Waiting for iOS..."

          xcrun simctl bootstatus "$UDID" -b

          echo ""
          echo "================================"
          echo "IPHONE BOOTED"
          echo "================================"

          xcrun simctl list devices |
          grep "$UDID"


      # ======================================================
      # PREMIER DEMARRAGE BAGUETTE LOCAL
      # ======================================================

      - name: Start temporary Baguette
        shell: bash
        run: |
          set -e

          nohup baguette serve \
            --host 127.0.0.1 \
            --port 8421 \
            > baguette-temp.log 2>&1 &

          BAGUETTE_PID=$!

          echo "Baguette PID: $BAGUETTE_PID"

          for i in {1..60}; do

            if curl \
              -fsS \
              http://127.0.0.1:8421/simulators.json \
              > /tmp/sims.json
            then

              echo ""
              echo "Baguette started."

              cat /tmp/sims.json

              kill "$BAGUETTE_PID" || true

              sleep 2

              exit 0

            fi

            sleep 1

          done

          echo "Baguette failed."

          cat baguette-temp.log || true

          exit 1


      # ======================================================
      # CLOUDFLARE QUICK TUNNEL
      # ======================================================

      - name: Create Cloudflare tunnel
        id: tunnel
        shell: bash
        run: |
          set -e

          echo "Starting Cloudflare tunnel..."

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8421 \
            --no-autoupdate \
            > cloudflare.log 2>&1 &

          URL=""

          for i in {1..90}; do

            URL="$(
              grep -Eo \
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
                cloudflare.log |
              head -1 || true
            )"

            if [ -n "$URL" ]; then
              break
            fi

            sleep 1

          done

          if [ -z "$URL" ]; then

            echo ""
            echo "Cloudflare URL not found."
            echo ""

            cat cloudflare.log

            exit 1

          fi

          HOST="${URL#https://}"

          echo "URL=$URL"
          echo "HOST=$HOST"

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"


      # ======================================================
      # LANCER BAGUETTE AVEC LE DOMAINE CLOUDFLARE
      # ======================================================

      - name: Start public Baguette
        shell: bash

        env:
          PUBLIC_HOST: ${{ steps.tunnel.outputs.host }}

        run: |
          set -e

          echo "Starting Baguette..."

          nohup baguette serve \
            --host 127.0.0.1 \
            --port 8421 \
            --allowed-hosts "$PUBLIC_HOST" \
            > baguette.log 2>&1 &

          for i in {1..90}; do

            if curl \
              -fsS \
              http://127.0.0.1:8421/simulators.json \
              > /tmp/baguette.json
            then

              echo "Baguette ready."

              cat /tmp/baguette.json

              exit 0

            fi

            sleep 1

          done

          echo "Baguette failed to start."

          cat baguette.log

          exit 1


      # ======================================================
      # AFFICHER URL
      # ======================================================

      - name: iPhone ready
        shell: bash

        env:
          URL: ${{ steps.tunnel.outputs.url }}
          UDID: ${{ steps.simulator.outputs.udid }}

        run: |

          echo ""
          echo "=================================================="
          echo ""
          echo "           IPHONE CLOUD READY"
          echo ""
          echo "=================================================="
          echo ""
          echo "$URL/simulators/$UDID"
          echo ""
          echo "Dashboard:"
          echo "$URL/simulators"
          echo ""
          echo "Device farm:"
          echo "$URL/farm"
          echo ""
          echo "=================================================="

          {
            echo ""
            echo "# 📱 iPhone Cloud prêt"
            echo ""
            echo "## 👉 [OUVRIR L'IPHONE]($URL/simulators/$UDID)"
            echo ""
            echo "### [Liste des simulateurs]($URL/simulators)"
            echo ""
            echo "### [Device Farm]($URL/farm)"
            echo ""
            echo "---"
            echo ""
            echo "**Machine :** GitHub macOS ARM64"
            echo ""
            echo "**Appareil :** iPhone 17 Pro"
            echo ""
            echo "**Interface :** Baguette"
            echo ""
            echo "⚠️ Ce lien est temporaire."
            echo ""
            echo "⚠️ Ne saisis pas ton Apple ID ou des données privées."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"


      # ======================================================
      # GARDER SESSION ACTIVE
      # ======================================================

      - name: Keep iPhone alive
        shell: bash

        env:
          URL: ${{ steps.tunnel.outputs.url }}

        run: |

          echo ""
          echo "iPhone session active."
          echo ""
          echo "$URL/simulators"
          echo ""
          echo "Session duration: 45 minutes."
          echo ""

          for i in {45..1}; do

            echo "Remaining: $i minutes"

            sleep 60

            curl \
              -fsS \
              http://127.0.0.1:8421/simulators.json \
              > /dev/null || true

          done

          echo ""
          echo "Session finished."
