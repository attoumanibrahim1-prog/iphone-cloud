name: iPhone Cloud

on:
  workflow_dispatch:

jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 60

    steps:

      # ======================================================
      # MAC / XCODE
      # ======================================================

      - name: Mac information
        shell: bash
        run: |
          set -e

          echo "===== MACHINE ====="
          uname -a
          uname -m

          echo ""
          echo "===== XCODE ====="
          xcodebuild -version
          xcode-select -p

          echo ""
          echo "===== SIMULATORS ====="
          xcrun simctl list devices available


      # ======================================================
      # INSTALLATION
      # ======================================================

      - name: Install Baguette and Cloudflare
        shell: bash
        run: |
          set -e

          brew install baguette cloudflared

          echo ""
          echo "===== BAGUETTE ====="
          which baguette
          baguette --help | head -40 || true

          echo ""
          echo "===== CLOUDFLARED ====="
          which cloudflared
          cloudflared --version


      # ======================================================
      # BOOT IPHONE
      # ======================================================

      - name: Boot iPhone 17 Pro
        id: simulator
        shell: bash
        run: |
          set -e

          echo "Recherche iPhone 17 Pro..."

          UDID="$(
            xcrun simctl list devices available |
            grep "iPhone 17 Pro (" |
            tail -1 |
            sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
          )"

          if [ -z "$UDID" ]; then
            echo "Fallback iPhone 17..."

            UDID="$(
              xcrun simctl list devices available |
              grep "iPhone 17 (" |
              tail -1 |
              sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
            )"
          fi

          if [ -z "$UDID" ]; then
            echo "Aucun iPhone trouvé."
            xcrun simctl list devices available
            exit 1
          fi

          echo "UDID=$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Boot..."

          xcrun simctl boot "$UDID" || true

          xcrun simctl bootstatus "$UDID" -b

          echo ""
          echo "===== IPHONE READY ====="

          xcrun simctl list devices |
          grep "$UDID"


      # ======================================================
      # DEMARRER BAGUETTE UNE SEULE FOIS
      # ======================================================

      - name: Start Baguette
        shell: bash
        run: |
          set -e

          echo "Démarrage Baguette..."

          nohup baguette serve \
            --host 127.0.0.1 \
            --port 8421 \
            --allowed-hosts '*.trycloudflare.com' \
            > baguette.log 2>&1 &

          BAGUETTE_PID=$!

          echo "$BAGUETTE_PID" > baguette.pid

          echo "PID Baguette: $BAGUETTE_PID"

          for i in {1..120}; do

            # Vérifier si le processus est mort
            if ! kill -0 "$BAGUETTE_PID" 2>/dev/null; then
              echo ""
              echo "================================"
              echo "BAGUETTE A CRASH"
              echo "================================"
              echo ""

              cat baguette.log || true

              exit 1
            fi

            # Vérifier serveur HTTP
            if curl \
              -fsS \
              http://127.0.0.1:8421/simulators.json \
              > /tmp/simulators.json
            then

              echo ""
              echo "================================"
              echo "BAGUETTE ONLINE"
              echo "================================"
              echo ""

              cat /tmp/simulators.json

              exit 0
            fi

            sleep 1
          done

          echo ""
          echo "Timeout Baguette."
          echo ""

          cat baguette.log || true

          exit 1


      # ======================================================
      # CLOUDFLARE
      # ======================================================

      - name: Create Cloudflare tunnel
        id: tunnel
        shell: bash
        run: |
          set -e

          echo "Démarrage Cloudflare..."

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8421 \
            --no-autoupdate \
            > cloudflare.log 2>&1 &

          CLOUDFLARE_PID=$!

          echo "Cloudflare PID: $CLOUDFLARE_PID"

          URL=""

          for i in {1..120}; do

            if ! kill -0 "$CLOUDFLARE_PID" 2>/dev/null; then

              echo ""
              echo "Cloudflare a crash."
              echo ""

              cat cloudflare.log || true

              exit 1
            fi

            URL="$(
              grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              cloudflare.log |
              head -1 || true
            )"

            if [ -n "$URL" ]; then
              break
            fi

            sleep 1
          done

          if [ -z "$URL" ]; then

            echo ""
            echo "URL Cloudflare introuvable."
            echo ""

            cat cloudflare.log

            exit 1
          fi

          echo ""
          echo "================================"
          echo "CLOUDFLARE ONLINE"
          echo "================================"
          echo ""

          echo "$URL"

          echo "url=$URL" >> "$GITHUB_OUTPUT"


      # ======================================================
      # TESTER LE LIEN PUBLIC
      # ======================================================

      - name: Test public iPhone
        shell: bash
        env:
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -e

          echo "Test du lien public..."
          echo "$URL"

          for i in {1..60}; do

            CODE="$(
              curl \
              -L \
              -s \
              -o /tmp/public.html \
              -w "%{http_code}" \
              "$URL/simulators" || true
            )"

            echo "HTTP $CODE"

            if [ "$CODE" = "200" ]; then

              echo ""
              echo "================================"
              echo "PUBLIC IPHONE ONLINE"
              echo "================================"

              exit 0
            fi

            sleep 2
          done

          echo ""
          echo "Le tunnel existe mais l'interface ne répond pas."
          echo ""

          echo "===== BAGUETTE LOG ====="
          cat baguette.log || true

          echo ""
          echo "===== CLOUDFLARE LOG ====="
          cat cloudflare.log || true

          exit 1


      # ======================================================
      # SUMMARY
      # ======================================================

      - name: iPhone ready
        shell: bash
        env:
          URL: ${{ steps.tunnel.outputs.url }}
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |

          echo ""
          echo "=========================================="
          echo "        IPHONE CLOUD READY"
          echo "=========================================="
          echo ""
          echo "$URL/simulators/$UDID"
          echo ""

          {
            echo "# 📱 iPhone Cloud prêt"
            echo ""
            echo "## 👉 [OUVRIR L'IPHONE]($URL/simulators/$UDID)"
            echo ""
            echo "### [Tous les simulateurs]($URL/simulators)"
            echo ""
            echo "### [Device Farm]($URL/farm)"
            echo ""
            echo "---"
            echo ""
            echo "**Appareil :** iPhone 17 Pro"
            echo ""
            echo "**Interface :** Baguette"
            echo ""
            echo "⚠️ URL temporaire Cloudflare."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"


      # ======================================================
      # KEEP ALIVE
      # ======================================================

      - name: Keep iPhone alive
        shell: bash
        env:
          URL: ${{ steps.tunnel.outputs.url }}
        run: |

          echo ""
          echo "Session iPhone active pendant 45 minutes."
          echo ""
          echo "$URL/simulators"
          echo ""

          for i in {45..1}; do

            echo "Temps restant : $i min"

            # Le serveur local doit toujours répondre
            curl \
              -fsS \
              http://127.0.0.1:8421/simulators.json \
              > /dev/null || true

            sleep 60

          done