name: iPhone Cloud

on:
  workflow_dispatch:

jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Mac information
        shell: bash
        run: |
          set -e

          echo "===== MAC ====="
          uname -a
          uname -m

          echo "===== XCODE ====="
          xcodebuild -version

          echo "===== SIMULATORS ====="
          xcrun simctl list devices available


      - name: Install Baguette and Cloudflare
        shell: bash
        run: |
          set -e

          brew install baguette cloudflared

          echo "===== BAGUETTE ====="
          which baguette

          echo "===== CLOUDFLARE ====="
          cloudflared --version


      - name: Boot iPhone 17 Pro
        id: simulator
        shell: bash
        run: |
          set -e

          UDID="$(
            xcrun simctl list devices available |
            grep "iPhone 17 Pro (" |
            tail -1 |
            sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
          )"

          if [ -z "$UDID" ]; then
            UDID="$(
              xcrun simctl list devices available |
              grep "iPhone 17 (" |
              tail -1 |
              sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
            )"
          fi

          if [ -z "$UDID" ]; then
            echo "Aucun iPhone trouvé"
            exit 1
          fi

          echo "iPhone UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          echo "===== IPHONE BOOTED ====="


      - name: Start Baguette
        shell: bash
        run: |
          set -e

          nohup baguette serve \
            --host 127.0.0.1 \
            --port 8421 \
            --allowed-hosts '*.trycloudflare.com' \
            > baguette.log 2>&1 &

          PID=$!

          echo "Baguette PID: $PID"

          for i in {1..120}; do

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "===== BAGUETTE CRASH ====="
              cat baguette.log || true
              exit 1
            fi

            if curl -fsS \
              http://127.0.0.1:8421/simulators.json \
              > /tmp/simulators.json
            then
              echo "===== BAGUETTE READY ====="
              cat /tmp/simulators.json
              exit 0
            fi

            sleep 1
          done

          echo "===== BAGUETTE TIMEOUT ====="
          cat baguette.log || true
          exit 1


      - name: Create Cloudflare tunnel
        id: tunnel
        shell: bash
        run: |
          set -e

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8421 \
            --no-autoupdate \
            > cloudflare.log 2>&1 &

          PID=$!

          echo "Cloudflare PID: $PID"

          URL=""

          for i in {1..120}; do

            if ! kill -0 "$PID" 2>/dev/null; then
              echo "===== CLOUDFLARE CRASH ====="
              cat cloudflare.log || true
              exit 1
            fi

            URL="$(
              grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              cloudflare.log |
              head -1 || true
            )"

            if [ -n "$URL" ]; then
              break
            fi

            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "Aucune URL Cloudflare"
            cat cloudflare.log || true
            exit 1
          fi

          echo "===== CLOUDFLARE READY ====="
          echo "$URL"

          echo "url=$URL" >> "$GITHUB_OUTPUT"


      - name: iPhone ready
        shell: bash
        env:
          URL: ${{ steps.tunnel.outputs.url }}
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          echo ""
          echo "============================================"
          echo "          IPHONE CLOUD READY"
          echo "============================================"
          echo ""
          echo "$URL/simulators"
          echo ""
          echo "$URL/simulators/$UDID"
          echo ""

          {
            echo "# 📱 iPhone Cloud prêt"
            echo ""
            echo "## 👉 [OUVRIR LES IPHONES]($URL/simulators)"
            echo ""
            echo "## 👉 [OUVRIR CET IPHONE]($URL/simulators/$UDID)"
            echo ""
            echo "---"
            echo ""
            echo "Le lien reste actif tant que le workflow tourne."
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Keep iPhone alive
        shell: bash
        env:
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          echo ""
          echo "Session active pendant 45 minutes"
          echo "$URL/simulators"
          echo ""

          for i in {45..1}; do
            echo "Temps restant: $i minutes"

            curl -fsS \
              http://127.0.0.1:8421/simulators.json \
              > /dev/null || true

            sleep 60
          done